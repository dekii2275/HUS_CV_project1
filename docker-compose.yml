services:
  db:
    image: timescale/timescaledb-ha:pg15
    container_name: itms-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT_EXTERNAL}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db_init:/docker-entrypoint-initdb.d
    networks:
      - itms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend_api
      dockerfile: Dockerfile
    container_name: itms-backend
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LLM_SERVICE_URL: http://itms-llm:18001
    ports:
      - "${BACKEND_PORT_EXTERNAL}:8000"
    volumes:
      - ./backend_api:/app
      - ./models:/app/models
    depends_on:
      db:
        condition: service_healthy
      llm:
        condition: service_started
    networks:
      - itms-network

  llm:
    build:
      context: ./intelligence_llm
      dockerfile: Dockerfile
    container_name: itms-llm
    restart: always
    environment:
      POSTGRES_URL: ${POSTGRES_URL}
      LLM_PROVIDER: ${LLM_PROVIDER}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      API_PORT: 18001
      CHROMA_PERSIST_DIR: /app/chroma_data
    ports:
      - "18001:18001"
    volumes:
      - ./intelligence_llm:/app
      - chroma_data:/app/chroma_data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - itms-network

  frontend:
    build:
      context: ./frontend_ui
      dockerfile: Dockerfile
      args:
        - GEMINI_API_KEY=${GEMINI_API_KEY}
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    container_name: itms-frontend
    restart: always
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "${FRONTEND_PORT_EXTERNAL}:80"
    depends_on:
      - backend
    networks:
      - itms-network

networks:
  itms-network:
    driver: bridge

volumes:
  pgdata:
  chroma_data:
