services:
  db:
    image: pgvector/pgvector:pg15
    container_name: itms-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT_EXTERNAL}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - itms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend_api
      dockerfile: Dockerfile
    container_name: itms-backend
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "${BACKEND_PORT_EXTERNAL}:8000"
    volumes:
      - ./backend_api:/app
      - ./models:/app/models
    depends_on:
      db:
        condition: service_healthy
    networks:
      - itms-network

  frontend:
    build:
      context: ./frontend_ui
      dockerfile: Dockerfile
    container_name: itms-frontend
    restart: always
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "${FRONTEND_PORT_EXTERNAL}:80"
    depends_on:
      - backend
    networks:
      - itms-network

networks:
  itms-network:
    driver: bridge

volumes:
  pgdata:
